<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Orbit Dodge</title>
<style>html,body{margin:0;height:100%;background:#0b0d17;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}canvas{display:block;width:100%;height:100%}</style>
</head><body><canvas id="c"></canvas>
<script>
// Orbit Dodge: tap anywhere to reverse your orbit direction. Survive as long as you can.
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H,cx,cy,R;
function fit(){const d=devicePixelRatio||1;W=c.width=innerWidth*d;H=c.height=innerHeight*d;cx=W/2;cy=H/2;R=Math.min(W,H)*.3}
addEventListener('resize',fit);fit();
let a,dir,speed,rocks,t,alive,best=+localStorage.orbitBest||0,spawn,sparks;
function reset(){a=0;dir=1;speed=2.2;rocks=[];sparks=[];t=0;alive=true;spawn=0}
reset();
function press(e){e.preventDefault();if(!alive){reset();return}dir=-dir}
addEventListener('pointerdown',press);
addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='Enter')press(e)});
function boom(x,y){for(let i=0;i<30;i++){const r=Math.random()*6.28,s=Math.random()*6+1;sparks.push({x,y,vx:Math.cos(r)*s,vy:Math.sin(r)*s,l:1})}}
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/16.67,3);last=now;
  if(alive){
    t+=dt/60;a+=dir*speed*dt*.012;
    spawn-=dt;
    if(spawn<=0){
      spawn=Math.max(14,60-t*1.6);
      const r=Math.random()*6.28,d=Math.hypot(W,H)/2+30,tr=R+(Math.random()<.5?-1:1)*R*.0;
      const px=cx+Math.cos(a+Math.random()*6.28)*R,py=cy+Math.sin(a+Math.random()*6.28)*R;
      const sx=cx+Math.cos(r)*d,sy=cy+Math.sin(r)*d,L=Math.hypot(px-sx,py-sy),v=(2.5+t*.05)*(Math.min(W,H)/500);
      rocks.push({x:sx,y:sy,vx:(px-sx)/L*v,vy:(py-sy)/L*v,s:(10+Math.random()*14)*(Math.min(W,H)/500)});
    }
    const px=cx+Math.cos(a)*R,py=cy+Math.sin(a)*R,pr=9*(Math.min(W,H)/500);
    for(const k of rocks){k.x+=k.vx*dt;k.y+=k.vy*dt;
      if(Math.hypot(k.x-px,k.y-py)<k.s+pr){alive=false;boom(px,py);if(t>best){best=t;localStorage.orbitBest=best}}}
    rocks=rocks.filter(k=>Math.hypot(k.x-cx,k.y-cy)<Math.hypot(W,H)/2+60);
  }
  g.fillStyle='rgba(11,13,23,.35)';g.fillRect(0,0,W,H);
  const u=Math.min(W,H)/500;
  g.strokeStyle='#26304f';g.lineWidth=2*u;g.beginPath();g.arc(cx,cy,R,0,6.283);g.stroke();
  g.fillStyle='#ff5d73';for(const k of rocks){g.beginPath();g.arc(k.x,k.y,k.s,0,6.283);g.fill()}
  if(alive){g.fillStyle='#5cf2c8';g.beginPath();g.arc(cx+Math.cos(a)*R,cy+Math.sin(a)*R,9*u,0,6.283);g.fill()}
  for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.l-=.02;g.globalAlpha=Math.max(s.l,0);g.fillStyle='#5cf2c8';g.fillRect(s.x,s.y,4*u,4*u)}
  g.globalAlpha=1;sparks=sparks.filter(s=>s.l>0);
  g.fillStyle='#e8ecff';g.textAlign='center';g.font=`${40*u}px sans-serif`;
  g.fillText(t.toFixed(1)+'s',cx,cy+14*u);
  g.font=`${16*u}px sans-serif`;g.fillStyle='#7c86b0';
  g.fillText(alive?'tap to reverse':'tap to retry  -  best '+best.toFixed(1)+'s',cx,cy+44*u);
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
